# docker/docker-compose.yml
version: '3.8'

services:
  # 1. Frontier & De-duplication (Includes Redis Lists, Sets, and Bloom Filter)
  redis:
    image: redis/redis-stack-server:latest
    container_name: crawler_redis
    ports:
      - "6379:6379"
    restart: always

  # 2. Metadata Storage
  postgres:
    image: postgres:15-alpine
    container_name: crawler_postgres
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler_password
      POSTGRES_DB: crawler_metadata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d
    restart: always

  # 3. Content Storage (S3-Compatible)
  minio:
    image: minio/minio
    container_name: crawler_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: always

  # Sidecar to auto-create the MinIO bucket
  minio-setup:
    image: minio/mc
    container_name: crawler_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/crawler-content --ignore-existing;
      exit 0;
      "

  # 4. Observability Layer
  prometheus:
    image: prom/prometheus:latest
    container_name: crawler_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: crawler_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always

  # 5. Worker Nodes (Placeholder for Step 2)
  crawler-worker:
    build: 
      context: ../
      dockerfile: docker/Dockerfile.worker
    depends_on:
      - redis
      - postgres
      - minio
    deploy:
      replicas: 3
    environment:
      - REDIS_URL=redis://redis:6379
      - PG_URL=postgres://crawler:crawler_password@postgres:5432/crawler_metadata
      - S3_ENDPOINT=minio
      - S3_PORT=9000


# Dedicated Frontier Router
  crawler-router:
    build: 
      context: ../
      dockerfile: docker/Dockerfile.worker
    command: ["node", "src/router.js"]
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379

volumes:
  pgdata:
  miniodata: